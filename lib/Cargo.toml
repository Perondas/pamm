[package]
name = "pamm_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
bi_fs_rs = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.103"
regex = "1.13.1"
url = { version = "2.5.8", features = ["serde"] }
bincode = { version = "2.0.1", features = ["serde"] }
sled = "0.34.7"
rayon = "1.12.0"
blake3 = "1.8.7"
urlencoding = "2.1.3"
open = "5.4.4"
log = "0.4.34"
run_script = { version = "0.11.2", optional = true }
chrono = { version = "0.4.45", optional = true }
static_assertions = "1.1.0"
steamlocate = "2.1.1"
tokio = { version = "1.54.0", features = ["fs", "io-util", "macros", "rt", "sync"] }
reqwest = { version = "0.13.5", features = ["stream"] }
futures = "0.3.34"
tokio-util = { version = "0.7.20", features = ["io"] }
bytes = "1.12.1"

[dev-dependencies]
mockall = "0.15.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }

[features]
# The client half of the library: `ClientRepoHandle` and everything hung off it —
# syncing against a remote, launching, and local (mission-maker) packs.
client = []
# The server half: `ServerRepoHandle`, building a repo into `www/`, and deploying.
server = []
deploy = ["server", "dep:run_script", "dep:chrono"]
