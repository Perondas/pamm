name: Cargo Test & Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          fetch-depth: '0'
          submodules: 'recursive'
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fmt
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Lint
        run: cargo clippy -- -D warnings

  # The workspace-root steps above only ever build pamm_lib with the union of
  # what the front-ends ask for (client + server + deploy), so a break confined
  # to one half of the feature split would go unnoticed. Each half has to stand
  # on its own, so check every valid combination explicitly.
  lib-features:
    name: pamm_lib (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - client
          - server
          - client,server
          - client,server,deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          fetch-depth: '0'
          submodules: 'recursive'
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run tests
        run: cargo test -p pamm_lib --no-default-features --features ${{ matrix.features }} --verbose
      - name: Lint
        run: cargo clippy -p pamm_lib --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings

  ui:
    defaults:
      run:
        working-directory: ./ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          fetch-depth: '0'
          submodules: 'recursive'
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install build deps for Linux
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev
      - name: Install project dependencies
        run: flutter pub get
      - name: Generate intermediates
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Enable build
        run: flutter config --enable-linux-desktop
      - name: Build
        run: flutter build linux
      - name: Run tests
        run: flutter test
