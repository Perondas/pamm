name: Cargo Test & Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows release.yml to reuse these jobs instead of duplicating them.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          fetch-depth: '0'
          submodules: 'recursive'
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Fmt
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Lint
        run: cargo clippy -- -D warnings

  # The workspace-root steps above only ever build pamm_lib with the union of
  # what the front-ends ask for (client + server + deploy), so a break confined
  # to one half of the feature split would go unnoticed. Each half has to stand
  # on its own, so check every valid combination explicitly.
  lib-features:
    name: pamm_lib (${{ matrix.features }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features:
          - client
          - server
          - client,server
          - client,server,deploy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          fetch-depth: '0'
          submodules: 'recursive'
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run tests
        run: cargo test -p pamm_lib --no-default-features --features ${{ matrix.features }} --verbose
      - name: Lint
        run: cargo clippy -p pamm_lib --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings

  ui:
    name: ui (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
    defaults:
      run:
        working-directory: ./ui
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          fetch-depth: '0'
          submodules: 'recursive'
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install build deps for Linux
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev
      - name: Install project dependencies
        run: flutter pub get
      - name: Generate intermediates
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Enable build
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Build
        run: flutter build ${{ matrix.target }}
      - name: Run tests
        run: flutter test
