[package]
name = "rust_lib_ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
pamm_lib = { path = "../../lib", features = ["client"] }
url = "2.5.8"
anyhow = "1.0.104"
log = { version = "0.4.34" , features = ["std"]}
serde_json = "1.0.154"
tokio-util = "0.7.20"
tokio = { version = "1.54.0", features = ["fs"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
